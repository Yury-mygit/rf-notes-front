<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveNotes — Заметки</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <header>
      <span class="logo">Заметки</span>
      <span id="status"></span>
    </header>
    <main>
      <aside id="sessions">
        <div class="sessions-toolbar">
          <button id="new-session-btn" title="Создать встречу">+ Новая встреча</button>
        </div>
        <div id="sessions-list"><div class="hint">Загрузка…</div></div>
      </aside>
      <section id="feed-pane">
        <div id="entry-toolbar" hidden>
          <button id="new-text-btn" title="Добавить текстовую заметку">📝 Текст</button>
          <button id="new-photo-btn" title="Добавить фото">📷 Фото</button>
          <button id="new-file-btn" title="Добавить файл">📎 Файл</button>
          <input id="photo-input" type="file" accept="image/*" hidden>
          <input id="file-input" type="file" hidden>
        </div>
        <div id="feed"><div class="hint">Выберите встречу</div></div>
      </section>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
